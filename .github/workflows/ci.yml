name: CI
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev libxkbcommon-dev libwayland-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  macos:
    # Builds and links the EventKit/PhotoKit/AOSKit code for real, and runs the tests.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: bbd embeds its Info.plist
        run: otool -s __TEXT __info_plist target/debug/bbd | head -3
