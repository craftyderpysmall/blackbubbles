[package]
name = "bb-client"
description = "BlackBubbles desktop app (egui) for Linux and macOS"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "blackbubbles"
path = "src/main.rs"

[dependencies]
bb-proto = { path = "../proto" }
bb-net = { path = "../net" }
bb-autofill = { path = "../autofill" }
bb-findmy = { path = "../findmy" }
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
futures-util.workspace = true
serde.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex.workspace = true
base64.workspace = true
rand.workspace = true
serde_json.workspace = true
rustls.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.37", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "gif", "webp"] }
walkers = { version = "0.65", default-features = false }
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4", "symphonia-wav", "symphonia-alac"] }
