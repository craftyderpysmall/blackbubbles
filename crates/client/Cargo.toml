[package]
name = "bb-client"
description = "BlackBubbles desktop app (Tauri) for Linux and macOS"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "blackbubbles"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bb-proto = { path = "../proto" }
bb-net = { path = "../net" }
bb-autofill = { path = "../autofill" }
bb-findmy = { path = "../findmy" }
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
futures-util.workspace = true
serde.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex.workspace = true
base64.workspace = true
rand.workspace = true
serde_json.workspace = true
rustls.workspace = true
reqwest.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
percent-encoding = "2"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4", "symphonia-alac", "wav"] }

[features]
# Set by `tauri build`/`tauri dev`; release builds embed the UI from ui/dist.
custom-protocol = ["tauri/custom-protocol"]
